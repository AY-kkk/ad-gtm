name: Validate skill library
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/skills.py validate
      - run: python -m unittest discover -s tests -v
      - run: python scripts/skills.py build --pack all --output dist
